services:
    web:
        build: .
        ports:
            - "8084:80"
        environment:
            DB_HOST: db
            DB_USER: root
            DB_PASS: ""
            DB_NAME: db_piss
        depends_on:
            - db
        volumes:
            - .:/var/www/html
    phpmyadmin:
        image: phpmyadmin:5.2-apache
        ports:
            - "8085:80"
        environment:
            PMA_HOST: db
            UPLOAD_LIMIT: 256M
        volumes:
            - ./docker/phpmyadmin-upload.ini:/usr/local/etc/php/conf.d/upload.ini
        depends_on:
            - db
    db:
        image: mysql:5.7
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: db_piss
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql
        command: --max_allowed_packet=256M

volumes:
    db_data:
